[project]
name = "pykmextract"
version = "0.1.0"
description = "Vision-assisted Kaplan-Meier curve extraction for PyHEOR workflows"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "PyKMExtract Team"},
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "Pillow>=9.0",
    "matplotlib>=3.5",
    "pydantic>=2.0",
]

[project.scripts]
pykmextract = "pykmextract.cli:main"
pykmextract-batch = "pykmextract.batch:main"
pykmextract-run-batch = "pykmextract.batch_run:main"

[project.optional-dependencies]
dev = []

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
